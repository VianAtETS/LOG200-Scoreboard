[package]
name = "isolation-ladder"
description = "Ladder, rating and weekly tournament of the LOG200 game labs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "isolation-ladder"
path = "src/main.rs"
doc = false

[dependencies]
game-kit = { workspace = true, features = ["openapi"] }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
http-body-util.workspace = true
jiff.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tungstenite.workspace = true
zip.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }

[dev-dependencies]
# Les règles d'Isolation des tests (`rules::Isolation`) : le ladder lui-même ne connaît aucun jeu.
isolation-core.workspace = true
tokio = { workspace = true, features = ["macros"] }

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[lints]
workspace = true
