# Envoie le jar de l'equipe au ladder a chaque push sur main qui modifie src/.
# A copier dans .github/workflows/ du depot de l'equipe, puis dans Settings > Secrets and variables > Actions :
#   variable LADDER_URL   : adresse de la page du ladder, par exemple http://ladder.example.org:8080
#   secret   LADDER_TOKEN : token de l'equipe (isolation-ladder add-team)
# Sans LADDER_URL, le workflow ne fait rien. Le verdict du ladder s'affiche dans le resume du run.
name: Ladder

permissions:
  contents: write # tagger la version soumise (V<n>)

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

# Une soumission a la fois : la suivante attend la fin du smoke test de la precedente.
concurrency:
  group: ladder
  cancel-in-progress: false

env:
  # true : obfusque le jar avec ProGuard avant l'envoi (voir l'etape "Obfusquer avec ProGuard").
  OBFUSCATE: false
  # true : vos parties se jouent sur plusieurs coeurs par couleur (adversaire compris), mais moins souvent.
  MULTITHREAD: false

jobs:
  submit:
    name: Envoyer le jar au ladder
    if: vars.LADDER_URL != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'

      # Le ladder execute les jars avec Java 24 : --release 24 garde le jar compatible meme avec un JDK plus recent.
      - name: Compiler
        run: javac -encoding UTF-8 --release 24 -d bin src/*.java

      - name: Obfusquer avec ProGuard
        if: env.OBFUSCATE == 'true'
        env:
          PROGUARD: 7.10.0
          PROGUARD_SHA256: fbff4dfe037d0724ff767ad555c06ebd14063ccf99a657cf05a69e6f2610da21
        run: |
          curl -sSfLo proguard.tar.gz "https://github.com/Guardsquare/proguard/releases/download/v$PROGUARD/proguard-$PROGUARD.tar.gz"
          echo "$PROGUARD_SHA256  proguard.tar.gz" | sha256sum -c -
          tar xzf proguard.tar.gz
          # Java 24 n'a plus de dossier jmods : les classes du JDK, que ProGuard doit connaitre, sortent de lib/modules.
          "$JAVA_HOME/bin/jimage" extract --dir jdk "$JAVA_HOME/lib/modules"
          {
            echo "-injars bin"
            echo "-outjars obf"
            for module in jdk/*; do echo "-libraryjars $module(!module-info.class)"; done
            echo "-keep class Client { public static void main(java.lang.String[]); }"
            echo "-keepattributes SourceFile,LineNumberTable"
            echo "-renamesourcefileattribute SourceFile"
            echo "-dontoptimize"
            echo "-printmapping mapping.txt"
          } > proguard.pro
          java -jar "proguard-$PROGUARD/lib/proguard.jar" @proguard.pro
          rm -rf bin && mv obf bin

      - name: Garder mapping.txt
        if: env.OBFUSCATE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: proguard-mapping
          path: mapping.txt

      # --date rend le jar reproductible. Ladder-Threads, dans le manifeste, declare le jar multithread.
      - name: Construire le jar
        run: |
          threads=1
          if [ "$MULTITHREAD" = true ]; then threads=2; fi
          echo "Ladder-Threads: $threads" > ladder.mf
          jar --create --file client.jar --main-class Client --manifest ladder.mf \
            --date "$(git log -1 --format=%cI)" -C bin .

      - name: Soumettre au ladder
        env:
          LADDER_URL: ${{ vars.LADDER_URL }}
          LADDER_TOKEN: ${{ secrets.LADDER_TOKEN }}
        run: |
          if [ -z "$LADDER_TOKEN" ]; then
            echo "::error::Secret LADDER_TOKEN absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          url=${LADDER_URL%/}
          auth="Authorization: Bearer $LADDER_TOKEN"
          hash=$(sha256sum client.jar | cut -c1-16)
          # Le ladder repond en texte brut, avec ces codes seulement. Une page HTML ou un autre code (403, 52x)
          # vient d'un proxy comme Cloudflare : ce n'est pas un verdict, le run avertit sans echouer.
          request() {
            local out
            rm -f response.txt
            out=$(curl -sS --max-time "$1" -o response.txt -w '%{http_code} %{content_type}' "${@:2}") || true
            http=${out%% *}
            http=${http:-000}
            from=proxy
            [ "$http" = 000 ] && from=none
            case "$http" in 200|202|400|401|404|413|422|429|500|503) [[ $out == *html* ]] || from=ladder ;; esac
          }
          report() {
            {
              echo "### Ladder : $1"
              echo
              echo '````text'
              echo "$2"
              echo '````'
              echo
              echo "Classement : $url/"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          unknown() {
            echo "::warning::$1"
            report "verdict inconnu" "$1
          Verdict du build $hash : $url/api/stats/submissions?team=<equipe>"
            exit 0
          }

          # ?async : le ladder repond 202 et le chemin du verdict, interroge ensuite (un proxy comme
          # Cloudflare coupe une requete sans reponse au bout de 100 s). Un ladder plus ancien repond 200.
          request 300 -X PUT -H "$auth" --data-binary @client.jar "$url/api/submit?async"
          if [ "$from" = proxy ]; then
            unknown "Envoi intercepte par un proxy (HTTP $http) : le jar n'a peut-etre pas ete recu. Relancer le workflow dans quelques minutes ; si ca se repete, verifier aussi LADDER_TOKEN."
          fi
          if [ "$http" = 202 ]; then
            verdict=$(head -n 1 response.txt)
            # Le smoke test prend quelques minutes ; le ladder garde le verdict une heure.
            end=$((SECONDS + 1200))
            blocked=0
            while :; do
              sleep 5
              request 30 -H "$auth" "$url$verdict"
              if [ "$from" = ladder ]; then
                [ "$http" = 202 ] || break
                blocked=0
              elif [ "$from" = proxy ]; then
                # Un blocage qui dure (pare-feu du proxy contre les IP des runners) ne se levera pas en attendant.
                blocked=$((blocked + 1))
                ((blocked < 4)) || unknown "Verdict intercepte par un proxy (HTTP $http, 4 essais de suite)."
                sleep 25
              fi
              ((SECONDS < end)) || unknown "Pas de verdict du ladder apres 20 min (derniere reponse : HTTP $http)."
            done
          fi
          body=$(cat response.txt 2>/dev/null || true)
          echo "HTTP $http : $body"
          report "HTTP $http" "$body"
          if [ "$http" != 200 ]; then
            reason=${body%%$'\n'*}
            echo "::error::${reason:-ladder injoignable a $url}"
            exit 1
          fi

      - name: Tagger la version soumise
        continue-on-error: true
        env:
          LADDER_URL: ${{ vars.LADDER_URL }}
        run: |
          hash=$(sha256sum client.jar | cut -c1-16)
          n=
          # Le build n'apparait qu'apres un moment : reessayer. Une reponse d'un proxy, elle, ne changera pas.
          for _ in $(seq 20); do
            out=$(curl -sS --max-time 30 -o summary.json -w '%{http_code} %{content_type}' \
              "${LADDER_URL%/}/data/summary.json") || out=000
            case "$out" in
              "200 application/json"*)
                n=$(jq -r --arg h "$hash" \
                  '[.builds[] | index($h) | select(. != null)] | first // empty | . + 1' summary.json) || true ;;
              000*) ;;
              *)
                echo "::warning::summary.json intercepte (HTTP ${out%% *}) : pas de tag."
                exit 0 ;;
            esac
            [ -n "$n" ] && break
            sleep 30
          done
          if [ -z "$n" ]; then
            echo "::warning::Build $hash absent de summary.json : pas de tag."
            exit 0
          fi
          tag="V$n"
          git fetch --tags --force --quiet origin
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::Tag $tag deja present : inchange."
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" "$GITHUB_SHA" -m "Ladder $tag, build $hash"
            git push origin "refs/tags/$tag"
          fi
          echo "Version du ladder : **$tag** (build \`$hash\`, commit \`${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"
