# Envoie le jar de l'equipe au ladder a chaque push sur main qui modifie src/.
# A copier dans .github/workflows/ du depot de l'equipe, puis dans Settings > Secrets and variables > Actions :
#   variable LADDER_URL   : adresse de la page du ladder, par exemple http://ladder.example.org:8080
#   secret   LADDER_TOKEN : token de l'equipe (isolation-ladder add-team)
# Sans LADDER_URL, le workflow ne fait rien. Le verdict du ladder s'affiche dans le resume du run.
name: Ladder

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

# Une soumission a la fois : la suivante attend la fin du smoke test de la precedente.
concurrency:
  group: ladder
  cancel-in-progress: false

env:
  # true : obfusque le jar avec ProGuard avant l'envoi (voir l'etape "Obfusquer avec ProGuard").
  OBFUSCATE: false
  # true : vos parties se jouent sur 2 coeurs par couleur (adversaire compris), mais moins souvent.
  MULTITHREAD: false

jobs:
  submit:
    name: Envoyer le jar au ladder
    if: vars.LADDER_URL != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'

      # Le ladder execute les jars avec Java 24 : --release 24 garde le jar compatible meme avec un JDK plus recent.
      - name: Compiler
        run: javac -encoding UTF-8 --release 24 -d bin src/*.java

      - name: Obfusquer avec ProGuard
        if: env.OBFUSCATE == 'true'
        env:
          PROGUARD: 7.10.0
          PROGUARD_SHA256: fbff4dfe037d0724ff767ad555c06ebd14063ccf99a657cf05a69e6f2610da21
        run: |
          curl -sSfLo proguard.tar.gz "https://github.com/Guardsquare/proguard/releases/download/v$PROGUARD/proguard-$PROGUARD.tar.gz"
          echo "$PROGUARD_SHA256  proguard.tar.gz" | sha256sum -c -
          tar xzf proguard.tar.gz
          # Java 24 n'a plus de dossier jmods : les classes du JDK, que ProGuard doit connaitre, sortent de lib/modules.
          "$JAVA_HOME/bin/jimage" extract --dir jdk "$JAVA_HOME/lib/modules"
          {
            echo "-injars bin"
            echo "-outjars obf"
            for module in jdk/*; do echo "-libraryjars $module(!module-info.class)"; done
            echo "-keep class Client { public static void main(java.lang.String[]); }"
            echo "-keepattributes SourceFile,LineNumberTable"
            echo "-renamesourcefileattribute SourceFile"
            echo "-dontoptimize"
            echo "-printmapping mapping.txt"
          } > proguard.pro
          java -jar "proguard-$PROGUARD/lib/proguard.jar" @proguard.pro
          rm -rf bin && mv obf bin

      - name: Garder mapping.txt
        if: env.OBFUSCATE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: proguard-mapping
          path: mapping.txt

      # --date rend le jar reproductible. Ladder-Threads, dans le manifeste, declare le jar multithread.
      - name: Construire le jar
        run: |
          threads=1
          if [ "$MULTITHREAD" = true ]; then threads=2; fi
          echo "Ladder-Threads: $threads" > ladder.mf
          jar --create --file client.jar --main-class Client --manifest ladder.mf \
            --date "$(git log -1 --format=%cI)" -C bin .

      - name: Soumettre au ladder
        env:
          LADDER_URL: ${{ vars.LADDER_URL }}
          LADDER_TOKEN: ${{ secrets.LADDER_TOKEN }}
        run: |
          if [ -z "$LADDER_TOKEN" ]; then
            echo "::error::Secret LADDER_TOKEN absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Le smoke test joue deux parties et attend la fin de la partie en cours : compter quelques minutes.
          code=$(curl -sS --max-time 900 -o response.txt -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $LADDER_TOKEN" --data-binary @client.jar \
            "${LADDER_URL%/}/api/submit") || code=000
          body=$(cat response.txt 2>/dev/null)
          echo "HTTP $code : $body"
          {
            echo "### Ladder : HTTP $code"
            echo
            echo '````text'
            echo "$body"
            echo '````'
            echo
            echo "Classement : ${LADDER_URL%/}/"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 200 ]; then
            reason=${body%%$'\n'*}
            echo "::error::${reason:-ladder injoignable a $LADDER_URL}"
            exit 1
          fi
