---
name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-image:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            docker: amd64
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            docker: arm64

    steps: &build-steps
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin isolation-referee --bin isolation-check --bin isolation-remote

      - name: Build bot
        run: cargo build --profile bot --locked --target ${{ matrix.target }} --bin isolation-bot

      - name: Build ladder
        if: ${{ matrix.docker }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin isolation-ladder
          mkdir -p "prebuilt/${{ matrix.docker }}"
          for bin in isolation-ladder isolation-referee isolation-check; do
            cp "target/${{ matrix.target }}/release/$bin" "prebuilt/${{ matrix.docker }}/"
          done
          cp "target/${{ matrix.target }}/bot/isolation-bot" "prebuilt/${{ matrix.docker }}/"

      - name: Upload image binaries
        if: ${{ matrix.docker }}
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.docker }}
          path: prebuilt
          if-no-files-found: error

      - name: Package
        shell: bash
        run: |
          name="isolation-${{ matrix.target }}"
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir "$name"
          for bin in isolation-referee isolation-check isolation-remote; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "$name/"
          done
          cp "target/${{ matrix.target }}/bot/isolation-bot$ext" "$name/"
          cp README.md "$name/"
          if [[ -n "$ext" ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: isolation-${{ matrix.target }}.*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            docker: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true

    steps: *build-steps

  image:
    name: Ladder image
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download image binaries
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: prebuilt
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vianatets/log200-scoreboard
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ladder.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BINARIES=prebuilt
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: [build, build-image, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Package deploy files
        run: |
          mkdir isolation-scoreboard-deploy
          cp deploy/compose.yml deploy/Caddyfile deploy/README.md ladder.example.toml isolation-scoreboard-deploy/
          zip -r dist/isolation-scoreboard-deploy.zip isolation-scoreboard-deploy

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
