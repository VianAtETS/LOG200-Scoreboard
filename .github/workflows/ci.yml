---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Each crate alone
        run: for crate in crates/*/; do cargo clippy --locked --all-targets -p "$(basename "$crate")" -- -D warnings; done

      - name: Tests
        run: cargo test --workspace --locked

  # The version is bumped after CI on main (version.yml): here, its rule and the scripts
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version bump rule
        run: bash tests/release/check.sh

      # Against a fake server in a JDK: one line per move, none with a dedicated reader thread
      - name: Profiler
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo eclipse-temurin:24-jdk bash sandbox/profiler/test.sh

      # Every tracked script, so a new one is checked without being listed here
      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - id: bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: web/package.json

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify frontend
        run: bun run suite

  # The one check a ruleset needs to require
  gate:
    if: always()
    needs: [rust, lint, web]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
