---
name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.node-version'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Restore package downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Audit
        working-directory: web
        run: bun run audit

      - name: Test
        working-directory: web
        run: bun run test

      - name: Build
        working-directory: web
        run: bun run typecheck && bun run build

      - name: Point the page at the server
        env:
          SERVER: ${{ vars.SCOREBOARD_URL }}
        run: |
          if [[ ! "$SERVER" =~ ^https://[^/\"]+$ ]]; then
            echo "::error::Variable de depot SCOREBOARD_URL absente ou invalide (attendu : https://domaine, sans / final)"
            exit 1
          fi
          for page in web/dist/*.html; do
            sed -i "s|<meta content=\"\" name=\"scoreboard-server\"|<meta content=\"$SERVER\" name=\"scoreboard-server\"|" "$page"
            grep -q "content=\"$SERVER\"" "$page"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload page
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
