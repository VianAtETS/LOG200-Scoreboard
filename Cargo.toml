[package]
name = "isolation"
version = "0.4.3"
edition = "2024"
description = "Arbitre, bot et ladder pour le lab Isolation (LOG200)"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tiny_http = "0.12"
toml = "1.1.8+spec-1.1.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
assert_is_empty = "allow"

[profile.release]
debug = 1
opt-level = 3 # Lock to 3 (default) to ensure it doesn't change

[profile.bot]
inherits = "release"
lto = "fat" # Let LLVM optimize calls between the bot and its dependencies at link time.
codegen-units = 1 # Optimize each crate as a whole instead of splitting it for parallel compilation.

[[bin]]
name = "isolation-referee"
path = "src/bin/referee.rs"

[[bin]]
name = "isolation-bot"
path = "src/bin/bot/main.rs"

[[bin]]
name = "isolation-ladder"
path = "src/bin/ladder/main.rs"

[[bin]]
name = "isolation-check"
path = "src/bin/check.rs"
