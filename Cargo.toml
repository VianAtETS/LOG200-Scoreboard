[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.31.0"
edition = "2024"
publish = false

[workspace.dependencies]
isolation-core = { path = "crates/isolation-core" }
isolation-engine = { path = "crates/isolation-engine" }
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio", "ws"] }
clap = { version = "4", features = ["derive", "env"] }
jiff = { version = "0.2.39", features = ["tzdb-bundle-always"] }
rand = "0.10.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1.5"
sha2 = "0.11.1"
signal-hook = "0.4"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
toml = "1.2.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.3.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
assert_is_empty = "allow"

[profile.release]
debug = 1
opt-level = 3 # Lock to 3 (default) to ensure it doesn't change

[profile.bot]
inherits = "release"
lto = "fat" # Let LLVM optimize calls between the bot and its dependencies at link time.
codegen-units = 1 # Optimize each crate as a whole instead of splitting it for parallel compilation.
